[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prouse"
version = "0.2.0"
description = "Coding tools for AI chat apps, scoped to your project folders"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ProUse contributors"}]
dependencies = [
  "mcp==1.30.0",
]

[project.scripts]
prouse = "prouse.cli:main"

[project.urls]
Repository = "https://github.com/pumpkinredbean/ProUse"

[tool.setuptools]
packages = ["prouse", "prouse.commands", "prouse.integrations", "prouse.runtime", "prouse.tools",
            "prouse_assets", "prouse_assets.admin_ui"]

[tool.setuptools.package-data]
prouse_assets = ["admin_ui/*.html", "admin_ui/*.js", "admin_ui/*.css", "admin_ui/*.svg"]
