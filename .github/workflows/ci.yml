name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }}${{ matrix.os == 'macos-latest' && ', macOS' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Most users run ProUse on a Mac with Claude Desktop.
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - name: Install dependencies
        run: python -m pip install .
      - name: Compile
        run: python -m compileall -q prouse tests scripts
      - name: Test
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build and inspect wheel
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv /tmp/prouse-wheel-test
          /tmp/prouse-wheel-test/bin/pip install dist/prouse-*.whl
          mkdir -p /tmp/prouse-wheel-project
          echo 'wheel test' > /tmp/prouse-wheel-project/README.md
          cd /tmp
          /tmp/prouse-wheel-test/bin/prouse --version
          PROUSE_HOME=/tmp/prouse-wheel-home /tmp/prouse-wheel-test/bin/prouse setup --workspace /tmp/prouse-wheel-project --no-input --json
          /tmp/prouse-wheel-test/bin/python -c 'from importlib import resources; assert "ProUse" in resources.files("prouse_assets").joinpath("admin_ui", "index.html").read_text()'
          export PROUSE_HOME=/tmp/prouse-wheel-home
          trap '/tmp/prouse-wheel-test/bin/prouse stop' EXIT
          /tmp/prouse-wheel-test/bin/prouse start --json
          /tmp/prouse-wheel-test/bin/prouse status --json
          /tmp/prouse-wheel-test/bin/prouse mcp check --json
          /tmp/prouse-wheel-test/bin/prouse restart --json
      - name: Release checks
        run: python scripts/release_check.py
